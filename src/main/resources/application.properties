spring.application.name=adventbackend
spring.config.import=optional:file:.env[.properties]
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
admin.clerk-user-id=${ADMIN_CLERK_USER_ID:}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adventdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Server Port
server.port=8081

# Flyway: versioned migrations live in classpath:/db/migration. Existing
# Postgres deployments are baselined at V1 on first boot — V1 is treated as
# "already applied" so we don't try to re-create the live schema. New schema
# changes go into V2+, applied normally.
# Graceful shutdown: stop accepting new requests, finish in-flight ones, then exit.
# Docker SIGTERM → up to 20s for outstanding work before SIGKILL.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator: expose health/info/metrics for prod observability. health endpoint
# shows status only by default; details are off for unauthenticated callers.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Disabled by default through Phase 1. Flyway here is still a placeholder (V1
# baseline, no real migrations — Hibernate ddl-auto=update + data.sql below own
# the schema). Worse, enabling it alongside spring.sql.init deferred init
# (spring.jpa.defer-datasource-initialization=true) creates a "Circular
# depends-on relationship between 'flyway' and 'entityManagerFactory'" that
# aborts startup. Phase 2 drops spring.sql.init.mode=always (removing that
# cycle) and flips this back on with a real V1 dump. Until then, keep it off.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway baseline (Hibernate ddl-auto=update era)

# Hibernate stays in "update" mode for now: still authoritative for fresh
# installs (until we replace V1 with a real pg_dump). Future Flyway migrations
# must use IF NOT EXISTS / DROP-then-CREATE patterns so they're safe to re-run
# alongside Hibernate.
# SQL Init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
challenge.cycle.pdf-path=${CHALLENGE_CYCLE_PDF_PATH:../Advent-calendar.pdf}

# Auth (Clerk)
clerk.jwt.enabled=${CLERK_JWT_ENABLED:false}
clerk.jwt.issuer=${CLERK_JWT_ISSUER:https://your-clerk-domain.clerk.accounts.dev}
clerk.jwt.audience=${CLERK_JWT_AUDIENCE:advent-api}
clerk.jwt.validate-audience=${CLERK_JWT_VALIDATE_AUDIENCE:false}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:advent-recap}
# Incoming transformation applied BEFORE storage so the stored master stays small
# (fit within 1600px, automatic quality). Main storage saver on the free tier.
cloudinary.upload-transformation=${CLOUDINARY_UPLOAD_TRANSFORMATION:c_limit,w_1600,h_1600,q_auto:good}

# Max photos a user may upload per month
photo.monthly-limit=${PHOTO_MONTHLY_LIMIT:300}

# Jackson JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
